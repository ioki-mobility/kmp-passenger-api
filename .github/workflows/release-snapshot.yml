name: Release to maven central snapshots

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  release:
    # Skip PRs coming from forks: they never get access to repository/Dependabot
    # secrets (by GitHub design), so publishing would fail anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    env:
      SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract pre-release identifier
        id: extract_prerelease
        run: |
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                echo "identifier=${{ github.event.pull_request.number }}-SNAPSHOT" >> $GITHUB_OUTPUT
            else
                echo "identifier=SNAPSHOT" >> $GITHUB_OUTPUT
            fi

      - name: Publish to Sonatype Snapshot
        run: ./gradlew publishAllPublicationsToSonatypeSnapshotRepository -PPRE_RELEASE_IDENTIFIER=${{ steps.extract_prerelease.outputs.identifier }} --no-configuration-cache
